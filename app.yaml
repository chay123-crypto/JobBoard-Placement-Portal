# Placement Portal - API Endpoints Documentation

#Home page index
app:
  - path: /
    method: GET
    status_codes:
      - 200  

#RBAC, Register and Login
auth:
  base_prefix: /auth
  endpoints:
    - path: /auth/register
      method: POST
      status_codes:
        - 200 # registered successfully
        - 400 # invalid role
        - 409 # email or contact already registered
 
    - path: /auth/login
      method: POST
      status_codes:
        - 200 # login success
        - 401 # invalid email/password
        - 403 # account deactivated
 
    - path: /auth/check
      method: GET
      status_codes:
        - 200 # authenticated
        - 401 # not logged in / login_required redirect
 
    - path: /auth/logout
      method: POST
      status_codes:
        - 200 # logged out

admin:
  base_prefix: /admin
  endpoints:
      - path: /admin/admin_dashboard
        method: GET
        status_codes:
          - 200 # dashboard
 
      - path: /admin/search_student
        method: GET
        status_codes:
          - 200 # student found
          - 404 # student not found
  
      - path: /admin/search_company
        method: GET
        status_codes:
          - 200 # companies found
          - 404 # company not found
  
      - path: /admin/view_students
        method: GET
        status_codes:
          - 200 # fetch students
  
      - path: /admin/view_companies
        method: GET
        status_codes:
          - 200 # fetch companies
  
      - path: /admin/all_drives
        method: GET
        status_codes:
          - 200 # fetch all the drives
  
      - path: /admin/drives/<int:drive_id>/applicants
        method: GET
        status_codes:
          - 200 # get applicants of a drive
          - 404 #drive not found
  
      - path: /admin/company/<int:company_id>/status
        method: PATCH
        status_codes:
          - 200  # status updated
          - 400  # unknown approval action
          - 404  # company not found
  
      - path: /admin/remind_interview/<int:interview_id>
        method: POST
        status_codes:
          - 201  # reminder task queued
          - 404  # interview not found
  
      - path: /admin/drive/<int:drive_id>/status
        method: PATCH
        status_codes:
          - 200  # status updated
          - 400  # unknown approval action
          - 404  # drive not found
  
      - path: /admin/user/<int:user_id>/deactivate
        method: PATCH
        status_codes:
          - 200  # activated/deactivated
          - 403  # cannot deactivate admin
          - 404  # user not found
  
      - path: /admin/placement
        method: GET
        status_codes:
          - 200 # fetch placements or selected students

company:
   base_prefix: /company
   endpoints:
    - path: /company/dashboard
      method: GET
      status_codes:
        - 200 # success! fetch company's dashboard
        - 403 # company not approved
        - 404 # company not found
 
    - path: /company/create_drive
      method: POST
      status_codes:
        - 200 # drive applied successfully
        - 400 # missing or improper fields
        - 403 # company not approved
        - 404 # company not found
 
    - path: /company/drives/applicants
      method: GET
      status_codes:
        - 200 # fetch applicants of the company
        - 404 # company not found
 
    - path: /company/student/<int:student_id>/info
      method: GET
      status_codes:
        - 200 # fetch student information
        - 404 # student not found
 
    - path: /company/drives/<int:drive_id>/applicants
      method: GET
      status_codes:
        - 200 # fetch applicants of each drive
        - 404 # company or drive not found
 
    - path: /company/application/<int:application_id>/status
      method: PATCH
      status_codes:
        - 200 # status updated
        - 400 # unknown approval action
        - 404 # application or drive not found
 
    - path: /company/export
      method: POST
      status_codes:
        - 202 # export task queued
 
    - path: /company/<int:company_id>/drives
      method: GET
      status_codes:
        - 200 #drives of that company
        - 404 # company not found / unauthorized company id
 
    - path: /company/drive/<int:drive_id>/close
      method: PATCH
      status_codes:
        - 200 # closed the drive
        - 404 # company or drive not found
 
    - path: /company/<int:company_id>/info
      method: GET
      status_codes:
        - 200 # get company info
        - 404 # company not found/unauthorized company id
 
    - path: /company/schedule_interview/<int:application_id>
      method: POST
      status_codes:
        - 200 # scheduled an interview for a student for a specifc job id
        - 400 # error occurred
        - 404 # application not found
 
    - path: /company/exported_csv_status/<task_id>
      method: GET
      status_codes:
        - 200 # details on status of the background celery task
 
student:
  base_prefix: /student
  endpoints:
    - path: /student/student_dashboard
      method: GET
      status_codes:
        - 200 # fetch the dashboard
        - 404 # student profile not found
 
    - path: /student/view_companies
      method: GET
      status_codes:
        - 200 #view all available companies
 
    - path: /student/search_company
      method: GET
      status_codes:
        - 200 # companies found
        - 404 # company not found
 
    - path: /student/all_drives
      method: GET
      status_codes:
        - 200 # fetch all drives
 
    - path: /student/student/<int:student_id>/applications
      method: GET
      status_codes:
        - 200 #applications of the student
        - 403 # unauthorized access
        - 404 # student profile not found
 
    - path: /student/student/<int:student_id>/edit-profile
      method: PATCH
      status_codes:
        - 200 # profile updated
        - 403 # unauthorized access
        - 404 # student profile not found
 
    - path: /student/drive/apply/<int:drive_id>
      method: POST
      status_codes:
        - 200 # applied successfully
        - 400 # already applied
        - 403 # not eligible (CGPA/dept/age/deadline/drive not approved)
        - 404 # student profile or drive not found
 
    - path: /student/student/<int:student_id>/placement
      method: GET
      status_codes:
        - 200 # placement history or no history if not selected
        - 400 # unauthorized access
        - 404 # student not found
 
    - path: /student/<int:student_id>/resume
      method: GET
      status_codes:
        - 200 # returns resume file
        - 403 # unauthorized access
        - 404 # no resume uploaded
 
    - path: /student/applications/<int:application_id>/withdraw
      method: PATCH
      status_codes:
        - 200 # withdrawn successfully
        - 400 # cannot withdraw in current status
        - 403 # unauthorized
        - 404 # student profile or application not found
 
    - path: /student/drives/eligible
      method: GET
      status_codes:
        - 200 # fetch eligible drives only
        - 404 # student not found
 
    - path: /student/<int:student_id>/info
      method: GET
      status_codes:
        - 200 # student information
        - 400 # unauthorized access
        - 404 # student not found
 
    - path: /student/export_csv_status/<task_id>
      method: GET
      status_codes:
        - 200 # status of the background celery task
 
    - path: /student/export
      method: POST
      status_codes:
        - 202 # export task queued
      
