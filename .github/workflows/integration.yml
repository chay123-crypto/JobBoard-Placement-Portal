name: integration

on:
 push:
    branches: [main]
 pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v4
       with:
         token: ${{ secrets.GITHUB_TOKEN }}
     - name: Set up Python
       uses: actions/setup-python@v5
       with: 
        python-version: "3.10"
     - name: install requirements
       run: pip install -r requirements.txt
     - name: lint with ruff
       run: ruff check . --fix --ignore E501,F841
     - name: Auto-format with black
       run: |
         pip install black
         black . --line-length 350
     - name: Commit formatting changes
       run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@users.noreply.github.com"
         git add -A
         git diff --staged --quiet || git commit -m "Auto-format with black"
         git push
     - name: run testing
       run: pytest tests/
       env:
          PYTHONPATH: .
          
       
