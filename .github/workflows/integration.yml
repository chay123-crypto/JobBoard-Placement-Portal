name: integration

on:
 push:
    branches: [main]
 pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v4
     - name: Set up Python
       uses: actions/setup-python@v5
       with: 
        python-version: "3.10"
     - name: install requirements
       run: pip install -r requirements.txt
     - name: lint with ruff
       run: ruff check . --line-length 120
     - name: Check formatting with black
       run: black --check .
     - name: run testing
       run: pytest tests/
          
       
